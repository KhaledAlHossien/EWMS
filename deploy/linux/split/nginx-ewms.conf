# Nginx لتثبيت EWMS المنفصل: الواجهة ملفات ثابتة من /var/www/ewms/web، والـ API خدمة ewms-api على 127.0.0.1:5000.
# انسخه إلى /etc/nginx/sites-available/ewms ثم:
#   sudo ln -s /etc/nginx/sites-available/ewms /etc/nginx/sites-enabled/ewms
#   sudo cp ../ewms-security-headers.conf /etc/nginx/snippets/      (الملف نفسه في حزمة الـ API: deploy/ewms-security-headers.conf)
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name ewms.example.local;            # ← اسم الخادم أو عنوانه كما يكتبه الموظفون

    # ── HTTPS (بعد تجهيز الشهادة): انقل محتوى هذه الكتلة إلى كتلة 443 واجعل هذه تحوّل فقط:
    # return 301 https://$host$request_uri;
    # listen 443 ssl http2;                   # (Nginx 1.24 في Ubuntu 24.04: http2 في سطر listen)
    # ssl_certificate     /etc/ssl/ewms/ewms.crt;
    # ssl_certificate_key /etc/ssl/ewms/ewms.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/ewms/web;
    index index.html;

    # أكبر طلب: ملف في حقول «ملفات» بطبقات الخرائط = MapLayers__MaxFileMegabytes (الافتراضي 100) + هامش
    client_max_body_size 105m;

    # ── الـ API (يضيف ترويسات الأمان لردوده بنفسه)
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;   # حد محاولات الدخول لكل جهاز يعتمد عليه
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;                                          # تصدير Excel والتقارير الكبيرة
    }

    # ── الإشعارات الفورية (SignalR / WebSocket)
    location /hubs/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5000;
        access_log off;
    }

    # ── ملفات البناء بأسماء فيها بصمة المحتوى: تُخزَّن عاماً كاملاً
    location ~* ^/(main|chunk|polyfills|styles)-[A-Za-z0-9_-]+\.(js|css)$ {
        include snippets/ewms-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── index.html لا يُخزَّن، كي يصل كل إصدار جديد فوراً
    location = /index.html {
        include snippets/ewms-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ── بقية ملفات الواجهة، وكل مسار من مسارات التطبيق يعود إلى index.html
    location / {
        include snippets/ewms-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
