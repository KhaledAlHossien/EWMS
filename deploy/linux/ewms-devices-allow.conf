# شبكات الفروع المسموح لأجهزة بصمتها بالاتصال بالمنفذ 8081 — سطر لكل شبكة، والباقي مرفوض.
# انسخه إلى /etc/nginx/snippets/ewms-devices-allow.conf وعدّل الشبكات، ثم: sudo nginx -t && sudo systemctl reload nginx
# مثال (احذفه واكتب شبكاتكم):
allow 10.10.0.0/16;      # المبنى المركزي
allow 10.20.0.0/16;      # فروع المنطقة الجنوبية
deny all;
