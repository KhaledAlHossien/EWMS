# Nginx أمام EWMS — انسخه إلى /etc/nginx/conf.d/ewms.conf (أو sites-available + رابط في sites-enabled)
# ثم: sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name ewms.example.local;          # ← اسم الخادم أو عنوانه

    # مع شهادة HTTPS: انقل ما تحت إلى كتلة 443 وحوّل 80 إليها:
    # listen 443 ssl;
    # ssl_certificate     /etc/ssl/ewms/ewms.crt;
    # ssl_certificate_key /etc/ssl/ewms/ewms.key;

    # ترويسات الأمان (CSP وغيرها) يضيفها التطبيق نفسه لكل رد في هذه الحزمة (الواجهة من wwwroot) — لا تكررها هنا.

    # أكبر طلب: ملف في حقول «ملفات» بطبقات الخرائط = MapLayers:MaxFileMegabytes (الافتراضي 100MB) + هامش
    client_max_body_size 105m;

    # الإشعارات الفورية (SignalR / WebSocket)
    location /hubs/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ── مرفقات فرع الدراسات: ملفات المخططات بلا سقف للحجم (قد تبلغ 1GB وأكثر) — رفع وتنزيل تدفقاً.
    #    الـ API يكتبها في مجلد المرفقات (FileStorage__Root) دائماً، فالحد هو مساحة ذلك المجلد.
    location ^~ /api/StudyAttachments/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size    0;      # بلا سقف
        proxy_request_buffering off;    # يمرّر الرفع إلى الـ API فوراً بدل تخزينه كاملاً على قرص Nginx أولاً
        proxy_buffering         off;    # والتنزيل كذلك
        client_body_timeout     3600s;
        proxy_send_timeout      3600s;
        proxy_read_timeout      3600s;
        send_timeout            3600s;
    }

    # الواجهة والـ API (الخادم نفسه يقدّم ملفات الواجهة)
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
