# Nginx أمام EWMS — انسخه إلى /etc/nginx/conf.d/ewms.conf (أو sites-available + رابط في sites-enabled)
# ثم: sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name ewms.example.local;          # ← اسم الخادم أو عنوانه

    # مع شهادة HTTPS: انقل ما تحت إلى كتلة 443 وحوّل 80 إليها:
    # listen 443 ssl;
    # ssl_certificate     /etc/ssl/ewms/ewms.crt;
    # ssl_certificate_key /etc/ssl/ewms/ewms.key;

    # أكبر طلب: مرفقات المهام (35MB)
    client_max_body_size 40m;

    # الإشعارات الفورية (SignalR / WebSocket)
    location /hubs/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # الواجهة والـ API (الخادم نفسه يقدّم ملفات الواجهة)
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
