# بوابة أجهزة البصمة (الحضور والانصراف، Push/ADMS) — منفذ مستقل 8081 لا يخدم إلا /iclock.
# الأجهزة تتصل بـ HTTP بلا تسجيل دخول (تعرّف نفسها برقمها التسلسلي)، لذلك:
#   - لا يقبل هذا المنفذ إلا شبكات الفروع (ewms-devices-allow.conf)، ويُفتح في الجدار الناري لها وحدها.
#   - الجهاز الجديد يبقى «بانتظار الموافقة» في صفحة أجهزة البصمة، ولا تُقبل بياناته حتى يُقبل.
#   - الترويسة X-EWMS-Device-Gateway يضعها Nginx هنا فقط؛ التطبيق يرفض /iclock إن لم تصله عبرها (Attendance__RequireGateway).
# التثبيت:
#   sudo cp ewms-devices.conf /etc/nginx/sites-available/ewms-devices
#   sudo cp ewms-devices-allow.conf /etc/nginx/snippets/      ← عدّل فيه شبكات الفروع
#   sudo ln -s /etc/nginx/sites-available/ewms-devices /etc/nginx/sites-enabled/ewms-devices
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo ufw allow from <شبكة كل فرع> to any port 8081 proto tcp

server {
    listen 8081;
    server_name _;

    include snippets/ewms-devices-allow.conf;

    access_log /var/log/nginx/ewms-devices.access.log;
    error_log  /var/log/nginx/ewms-devices.error.log;

    # دفعات القوالب وصور لحظة البصم
    client_max_body_size 20m;

    location /iclock/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # يُستبدل ما قد يرسله الطرف الآخر بالقيمة الصحيحة
        proxy_set_header   X-EWMS-Device-Gateway 1;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
