# ترويسات الأمان لملفات الواجهة حين يقدّمها Nginx بنفسه (الخادم الحالي: /var/www/dmc/EWMS-App/angular).
# ردود الـ API تأتي بها من الخادم نفسه (SecurityHeadersMiddleware) فلا تُضمَّن هذه في location الـ API.
# الاستعمال: sudo cp … /etc/nginx/snippets/ewms-security-headers.conf
#            ثم داخل location الذي يقدّم ملفات الواجهة:  include snippets/ewms-security-headers.conf;
# تنبيه Nginx: أي add_header داخل location يُلغي ما ورثه من server، لذا ضع الـ include داخل location نفسه.
# سياسة CSP هنا مطابقة لـ API/Middlewares/SecurityHeadersMiddleware.cs — عدّلهما معاً.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# بعد تفعيل HTTPS فقط (كتلة 443)، بمدة قصيرة أولاً ثم تُرفع بعد التأكد:
# add_header Strict-Transport-Security "max-age=86400" always;
